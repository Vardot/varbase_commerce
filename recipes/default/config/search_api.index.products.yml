langcode: en
status: true
dependencies:
  config:
    - field.storage.commerce_product.body
    - field.storage.commerce_product.field_category
    - search_api.server.database
  module:
    - commerce_product
id: products
name: Products
description: 'Provided by the Varbase Commerce merchandise section.'
read_only: false
field_settings:
  body:
    label: Body
    datasource_id: 'entity:commerce_product'
    property_path: body
    type: text
    boost: 0.3
    dependencies:
      config:
        - field.storage.commerce_product.body
  body_spellcheck:
    label: Body
    datasource_id: 'entity:commerce_product'
    property_path: body
    type: text
    boost: 0.3
    dependencies:
      config:
        - field.storage.commerce_product.body
  created:
    label: Created
    datasource_id: 'entity:commerce_product'
    property_path: created
    type: date
    dependencies:
      module:
        - commerce_product
  field_category:
    label: Category
    datasource_id: 'entity:commerce_product'
    property_path: field_category
    type: integer
    dependencies:
      config:
        - field.storage.commerce_product.field_category
  field_category_fulltext:
    label: Category
    datasource_id: 'entity:commerce_product'
    property_path: field_category
    type: text
    boost: 0.5
    dependencies:
      config:
        - field.storage.commerce_product.field_category
  number:
    label: 'Variations » Product variation » Price » Number'
    datasource_id: 'entity:commerce_product'
    property_path: 'variations:entity:price:number'
    type: integer
    dependencies:
      module:
        - commerce_product
  title:
    label: Title
    datasource_id: 'entity:commerce_product'
    property_path: title
    type: text
    boost: 21.0
    dependencies:
      module:
        - commerce_product
  title_spellcheck:
    label: Title
    datasource_id: 'entity:commerce_product'
    property_path: title
    type: text
    dependencies:
      module:
        - commerce_product
datasource_settings:
  'entity:commerce_product':
    bundles:
      default: true
      selected: {  }
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  custom_value: {  }
  entity_status: {  }
  entity_type: {  }
  hierarchy:
    weights:
      preprocess_index: -45
    fields:
      field_category: taxonomy_term-parent
      field_promotion: taxonomy_term-parent
  html_filter:
    weights:
      preprocess_index: -49
      preprocess_query: -15
    all_fields: true
    fields:
      - body
      - body_spellcheck
      - field_category_fulltext
      - title
      - title_spellcheck
    title: true
    alt: true
    tags:
      b: 2.0
      h1: 5.0
      h2: 3.0
      h3: 2.0
      strong: 2.0
  ignore_character:
    weights:
      preprocess_index: -48
      preprocess_query: -10
    all_fields: true
    fields:
      - body
      - body_spellcheck
      - field_category_fulltext
      - title
      - title_spellcheck
    ignorable: "['¿¡!?,.:;]"
    ignorable_classes:
      - Pc
      - Pd
      - Pe
      - Pf
      - Pi
      - Po
      - Ps
  ignorecase:
    all_fields: false
  language_with_fallback: {  }
  rendered_item: {  }
  reverse_entity_references: {  }
  tokenizer:
    all_fields: false
    spaces: ''
    ignored: ._-
    overlap_cjk: 1
    minimum_word_size: '3'
  transliteration:
    all_fields: false
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  delete_on_fail: true
  index_directly: true
  track_changes_in_references: true
server: database
