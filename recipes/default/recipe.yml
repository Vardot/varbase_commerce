name: 'Varbase Commerce'
description: 'Sets up the Varbase merchandise section and products catalog. Enables Drupal Commerce 3 (cart, product, checkout, payment, tax, promotion, shipping), the wishlist, product ratings, search and facets, then the Varbase Commerce configuration. All the modules the section needs are enabled here rather than as hard dependencies of the module.'
type: 'Content type'
install:
  - media
  - media_library
  - comment
  - views_data_export
  - votingapi
  - commerce
  - commerce_store
  - commerce_number_pattern
  - commerce_price
  - commerce_order
  - commerce_product
  - commerce_cart
  - commerce_checkout
  - commerce_payment
  - commerce_tax
  - commerce_promotion
  - commerce_shipping
  - commerce_wishlist
  - fivestar
  - flag
  - search_api
  - search_api_db
  - search_api_autocomplete
  - facets
  - facets_block
  - better_exposed_filters
  - entityqueue
  - taxonomy
  - path
  - options
  - content_translation
  - layout_builder
  - field_group
  - allowed_formats
  - entity_browser
  - entity_browser_entity_form
  - inline_entity_form
  - views_infinite_scroll
  - slick
  - slick_views
  - smart_trim
  - color_field
  - term_reference_tree
  - varbase_commerce
